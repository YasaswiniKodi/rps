 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>✊ Rock Paper Scissors ✋</h1>

    <div class="score-board">
        <div>
            <h2 id="userScore">0</h2>
            <p>You</p>
        </div>

        <div>
            <h2 id="computerScore">0</h2>
            <p>Computer</p>
        </div>
    </div>

    <div class="choices">

        <button class="choice" onclick="playGame('rock')">
            ✊
        </button>

        <button class="choice" onclick="playGame('paper')">
            ✋
        </button>

        <button class="choice" onclick="playGame('scissors')">
            ✌️
        </button>

    </div>

    <div class="result-box">

        <h2 id="result">
            Choose your move!
        </h2>

        <p id="moves"></p>

    </div>

    <button id="restart" onclick="restartGame()">
        Restart Game
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
